# ==============================================================================
# .github/workflows/miniprogram-checks.yml
#
# 功能：微信小程序面的静态门禁——语法、代码包体积、页面声明对账、后端端点对账、
#       依赖声明对账五道，判据全部住在 scripts/ci/miniprogram-checks.sh 一处，
#       本地与云端跑同一份脚本，杜绝"本地能过、CI 红"与"CI 过、本地红"的口径分叉。
# 调用方：改动 miniprogram/ 下任何页面的 js/wxml/wxss/json、改动 app.json 的页面与
#       分包声明、改动任何 /api/v1/erp 调用点、改动门禁脚本自身的工作流定义时触发；
#       也可 workflow_dispatch 手动跑一次（用于体积整改中途看数）。
# 入参：无（工作流把仓库检出后直接调脚本；阈值见脚本 env 段，
#       MP_SUBPACKAGE_LIMIT_KB=2048 与 MP_TOTAL_LIMIT_KB=20480 取微信官方上限）
# 传给谁：scripts/ci/miniprogram-checks.sh → 其内部三份判定器
#       （node --check 逐文件、体积计量、scripts/ci/mp-check-pages.cjs 页面对账、
#        scripts/ci/mp-endpoint-check.cjs 端点对账）
# 存什么：不写仓、不写凭据；只把门禁的逐行结论写进 $GITHUB_STEP_SUMMARY 供人读，
#       以及把体积明细落工作流日志供分片比对
# 存哪里：仅 Actions 运行摘要与日志
#
# 为什么先跑 --self-test：判定器必须先证明"能抓到已知违规"才允许它的绿被采信。
#   本项目已多次出现"扫描面自己变窄导致零命中被当成通过"的假绿，反向夹具是唯一
#   能在 CI 侧长期防住的机制，因此自证失败按 9 退出（TOOL_BUG），不判绿也不判红。
#
# 为什么没有"源码还没入库就跳过"的保护：本文件必须与 miniprogram/ 源码同一次变更
#   入库。若在这里加 job 级 if 做适用性判定，会出现"作业绿但一道都没跑"的假绿；
#   而 actionlint 实测 hashFiles() 只在 steps 的 if 等位置可用（jobs.<job_id>.if 非法），
#   把它挪到步骤级同样会造成"全步骤 skipped 而 job success"。宁可不写这层判断，
#   也不要一个会假装验证过的守卫。paths 过滤本身已保证只有动到小程序面或门禁脚本
#   自身时本工作流才触发。
# ==============================================================================

name: 小程序静态门

on:
  pull_request:
    paths:
      - "miniprogram/**"
      - "scripts/ci/miniprogram-checks.sh"
      - "scripts/ci/mp-check-pages.cjs"
      - "scripts/ci/mp-endpoint-check.cjs"
      - "frontend/scripts/route-snapshot.txt"
      - ".github/workflows/miniprogram-checks.yml"
  push:
    branches:
      - main
    paths:
      - "miniprogram/**"
      - "scripts/ci/miniprogram-checks.sh"
      - "scripts/ci/mp-check-pages.cjs"
      - "scripts/ci/mp-endpoint-check.cjs"
      - "frontend/scripts/route-snapshot.txt"
      - ".github/workflows/miniprogram-checks.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"

jobs:
  miniprogram-checks:
    name: 语法与体积与页面与端点与依赖
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 装配 Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 判定器反向自证（抓不到已知违规就判 TOOL_BUG）
        shell: bash
        run: bash scripts/ci/miniprogram-checks.sh --self-test

      - name: 五道静态门（语法/体积/页面对账/端点对账/依赖对账）
        shell: bash
        run: bash scripts/ci/miniprogram-checks.sh | tee -a "$GITHUB_STEP_SUMMARY"
