name: 小程序测试与受控发布

on:
  pull_request:
    paths:
      - 'miniprogram/**'
      - 'tests/miniprogram/**'
      - 'scripts/ci/miniprogram-checks.sh'
      - 'scripts/ci/miniprogram-release.cjs'
      - 'scripts/ci/miniprogram-ci-release.cjs'
      - 'scripts/ci/mp-check-pages.cjs'
      - 'scripts/ci/mp-endpoint-check.cjs'
      - 'frontend/scripts/route-snapshot.txt'
      - '.github/workflows/miniprogram-checks.yml'
  push:
    branches:
      - main
    paths:
      - 'miniprogram/**'
      - 'tests/miniprogram/**'
      - 'scripts/ci/miniprogram-checks.sh'
      - 'scripts/ci/miniprogram-release.cjs'
      - 'scripts/ci/miniprogram-ci-release.cjs'
      - 'scripts/ci/mp-check-pages.cjs'
      - 'scripts/ci/mp-endpoint-check.cjs'
      - 'frontend/scripts/route-snapshot.txt'
      - '.github/workflows/miniprogram-checks.yml'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号，必须与 miniprogram/package.json 一致'
        required: true
        type: string
      mode:
        description: 'preview 只生成预览码；upload 上传开发版，均不执行线上发布'
        required: true
        type: choice
        options:
          - preview
          - upload
        default: preview
      robot:
        description: '微信 CI 机器人编号（1-30）'
        required: true
        type: number
        default: 1
      desc:
        description: '开发版备注（1-200 字符）'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'
  NPM_CONFIG_AUDIT: false
  NPM_CONFIG_FUND: false

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: 七道静态门与 Node 单测
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: 装配 Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: miniprogram/package-lock.json

      - name: 安装锁定依赖（不执行生命周期脚本）
        working-directory: miniprogram
        run: npm ci --ignore-scripts

      - name: 运行时依赖高危审计
        run: npm --prefix miniprogram audit --omit=dev --audit-level=high

      - name: 判定器反向自证
        run: bash scripts/ci/miniprogram-checks.sh --self-test

      - name: 七道静态门与 Node 单测
        run: |
          set -o pipefail
          bash scripts/ci/miniprogram-checks.sh | tee -a "$GITHUB_STEP_SUMMARY"
          npm --prefix miniprogram test

      - name: 校验 Babel 运行时可复现引用
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const pkg = require('./miniprogram/package.json');
          const lock = require('./miniprogram/package-lock.json');
          if (!pkg.dependencies['@babel/runtime']) throw new Error('缺少 @babel/runtime 声明');
          if (lock.packages['node_modules/@babel/runtime'].version !== pkg.dependencies['@babel/runtime']) {
            throw new Error('@babel/runtime lockfile 版本漂移');
          }
          let references = 0;
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (['node_modules', 'miniprogram_npm', '@babel'].includes(entry.name)) continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.name.endsWith('.js')) {
                const text = fs.readFileSync(full, 'utf8');
                references += (text.match(/@babel\/runtime\//g) || []).length;
              }
            }
          }
          walk('miniprogram');
          if (references === 0) throw new Error('Babel 扫描面为空');
          console.log(`MP_BABEL_OK references=${references} version=${pkg.dependencies['@babel/runtime']}`);
          NODE

  source-package:
    name: 版本化源码工程包
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      short_sha: ${{ steps.prepare.outputs.short_sha }}
    steps:
      - name: 检出代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: 装配 Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 读取单一版本来源
        id: prepare
        run: |
          VERSION="$(node -p "require('./miniprogram/package.json').version")"
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'short_sha=%s\n' "$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: 生成净化源码 ZIP 与 release manifest
        run: |
          node scripts/ci/miniprogram-release.cjs \
            --version "${{ steps.prepare.outputs.version }}" \
            --output miniprogram-release-output

      - name: 上传可下载源码工程包
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: miniprogram-source-${{ steps.prepare.outputs.version }}-${{ steps.prepare.outputs.short_sha }}
          path: |
            miniprogram-release-output/miniprogram-source-*.zip
            miniprogram-release-output/release-manifest.json
          if-no-files-found: error
          retention-days: 30

  controlled-release:
    name: 受控预览或上传开发版
    needs: [quality, source-package]
    if: ${{ github.event_name == 'workflow_dispatch' }}
    environment: miniprogram-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: 装配 Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: miniprogram/package-lock.json

      - name: 下载同提交源码工程包与 manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: miniprogram-source-${{ needs.source-package.outputs.version }}-${{ needs.source-package.outputs.short_sha }}
          path: miniprogram-release-output

      - name: 发布前强制检查秘密与版本
        env:
          WECHAT_MINIPROGRAM_PRIVATE_KEY: ${{ secrets.WECHAT_MINIPROGRAM_PRIVATE_KEY }}
          BINGXI_HOST: ${{ secrets.BINGXI_HOST }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$WECHAT_MINIPROGRAM_PRIVATE_KEY" ]; then
            echo "MP_RELEASE_RED 缺少 WECHAT_MINIPROGRAM_PRIVATE_KEY" >&2
            exit 1
          fi
          if [ -z "$BINGXI_HOST" ]; then
            echo "MP_RELEASE_RED 缺少 BINGXI_HOST" >&2
            exit 1
          fi
          EXPECTED="$(node -p "require('./miniprogram/package.json').version")"
          if [ "$RELEASE_VERSION" != "$EXPECTED" ]; then
            echo "MP_RELEASE_RED version=$RELEASE_VERSION 与 package.json=$EXPECTED 不一致" >&2
            exit 1
          fi

      - name: 安装锁定依赖（不执行生命周期脚本）
        working-directory: miniprogram
        run: npm ci --ignore-scripts

      - name: 构建 npm 并执行 preview 或 upload
        env:
          WECHAT_MINIPROGRAM_PRIVATE_KEY: ${{ secrets.WECHAT_MINIPROGRAM_PRIVATE_KEY }}
          BINGXI_HOST: ${{ secrets.BINGXI_HOST }}
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_ROBOT: ${{ inputs.robot }}
          RELEASE_DESC: ${{ inputs.desc }}
        run: |
          node scripts/ci/miniprogram-ci-release.cjs \
            --mode "$RELEASE_MODE" \
            --version "$RELEASE_VERSION" \
            --robot "$RELEASE_ROBOT" \
            --desc "$RELEASE_DESC" \
            --output miniprogram-release-output

      - name: 清理发布临时秘密与本地主机文件
        id: cleanup
        if: ${{ always() }}
        run: |
          rm -f "$RUNNER_TEMP/wechat-miniprogram-private.key"
          rm -f miniprogram/mpHost.local.js

      - name: 上传预览码或上传结果与源码包
        if: ${{ always() && steps.cleanup.outcome != 'cancelled' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: miniprogram-${{ inputs.mode }}-${{ needs.source-package.outputs.version }}-${{ needs.source-package.outputs.short_sha }}
          path: |
            miniprogram-release-output/preview-qrcode.png
            miniprogram-release-output/wechat-ci-result.json
            miniprogram-release-output/release-manifest.json
            miniprogram-release-output/miniprogram-source-*.zip
          if-no-files-found: error
          retention-days: 30
