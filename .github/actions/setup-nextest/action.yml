# Composite action：统一安装 cargo-nextest（原 3 个 job 逐字重复）
name: Setup cargo-nextest
description: 安装 cargo-nextest 测试运行器，供预编译/测试/分片 job 复用
runs:
  using: composite
  steps:
    - name: 安装 cargo-nextest
      uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2
      with:
        tool: nextest
